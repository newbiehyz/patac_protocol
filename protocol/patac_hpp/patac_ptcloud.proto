syntax = "proto3";
package patac_hpp;

message PointC {

  float x = 1;
  float y = 2;
  float z = 3; 
  uint32 label = 4;

}
message Pose {

  float x = 1;
  float y = 2;
  float z = 3;
  float yaw = 4; 
  float roll = 5; 
  float pitch = 6; 
}
message Ptcloud {

  uint64 timestamp = 1;

  uint32 frame_id = 2;

  uint32 num_pt = 3;

  Pose pose = 4;
  
  repeated PointC ptcloud_list = 5;
}
message Ptcloudframelist {
 
  uint32 num_frame = 1;

  repeated Ptcloud ptcloudframe_list = 2;
}